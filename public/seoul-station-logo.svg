<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cccccc;stop-opacity:1" />
    </linearGradient>
    <filter id="distress" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#000000"/>
  
  <!-- Face silhouette -->
  <ellipse cx="50" cy="40" rx="25" ry="35" fill="#2a2a2a"/>
  <ellipse cx="50" cy="35" rx="20" ry="25" fill="#404040"/>
  
  <!-- Eyes -->
  <ellipse cx="45" cy="30" rx="4" ry="6" fill="#ffffff"/>
  <ellipse cx="55" cy="30" rx="4" ry="6" fill="#ffffff"/>
  
  <!-- Mouth -->
  <path d="M 40 45 Q 50 55 60 45" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Teeth -->
  <rect x="42" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="44.5" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="47" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="49.5" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="52" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="54.5" y="45" width="1.5" height="4" fill="#ffffff"/>
  <rect x="57" y="45" width="1.5" height="4" fill="#ffffff"/>
  
  <!-- Text -->
  <text x="85" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#textGradient)" filter="url(#distress) url(#glow)">SEOUL</text>
  <text x="85" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#textGradient)" filter="url(#distress) url(#glow)">STATION</text>
</svg>
